spring.application.name=backeng
spring.profiles.default=dev
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${AJEGT_DATABASE_URL:jdbc:h2:file:./target/ajegt;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AJEGT_DATABASE_USERNAME:sa}
spring.datasource.password=${AJEGT_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${AJEGT_DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ajegt.cors.allowed-origin=${AJEGT_FRONTEND_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
